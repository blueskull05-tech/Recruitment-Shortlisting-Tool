<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RVCE Recruitment Shortlisting Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --desk:        #1b2430;
    --desk-deep:   #131a24;
    --tab:         #202b3a;
    --tab-active:  #263650;
    --card:        #f1e9d8;
    --card-shadow: #d9c9a6;
    --ink:         #2b2118;
    --ink-soft:    #5a4c3d;
    --sidebar-txt: #d8dce3;
    --muted:       #8794a6;
    --teal:        #3f8f7d;
    --teal-deep:   #2f6f62;
    --green:       #3f7d4a;
    --red:         #b23a2e;
    --divider:     #303e51;
    --radius:      3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--desk);color:var(--sidebar-txt);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Zilla Slab',serif;}
  #shell{display:flex;height:100vh;overflow:hidden;}

  #sidebar{width:238px;flex-shrink:0;background:var(--desk-deep);display:flex;flex-direction:column;border-right:1px solid var(--divider);}
  .brand{padding:26px 20px 18px;border-bottom:1px solid var(--divider);}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;}
  .brand h1{margin:6px 0 0;font-size:21px;line-height:1.2;color:#f2efe6;font-weight:600;}
  .punch-row{display:flex;gap:6px;margin-top:14px;}
  .punch{width:7px;height:7px;border-radius:50%;background:var(--desk);border:1px solid #364356;}
  nav{padding:14px 12px;flex:1;overflow-y:auto;}
  .tab{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:4px;border-radius:var(--radius) 0 0 var(--radius);color:var(--muted);cursor:pointer;font-size:14px;border-left:3px solid transparent;transition:background .12s ease,color .12s ease;user-select:none;}
  .tab:hover{background:var(--tab);color:#eef1f4;}
  .tab.active{background:var(--tab-active);color:#fff;border-left-color:var(--teal);font-weight:500;}
  .tab .num{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.6;width:16px;}
  .sidebar-foot{padding:16px 20px 20px;border-top:1px solid var(--divider);}
  #save-exit-btn{width:100%;background:transparent;border:1px solid var(--divider);color:var(--sidebar-txt);padding:9px;border-radius:var(--radius);cursor:pointer;font-size:12.5px;margin-bottom:10px;}
  #save-exit-btn:hover{border-color:var(--red);color:#fff;}
  .conn{font-size:11px;color:var(--muted);}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);margin-right:6px;}
  .dot.unsaved{background:#c98a2c;}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{padding:20px 34px;border-bottom:1px solid var(--divider);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0;}
  #topbar h2{margin:0;font-size:19px;color:#f2efe6;font-weight:600;}
  #topbar .sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .topbar-controls{display:flex;gap:10px;align-items:center;}
  #content{flex:1;overflow-y:auto;padding:30px 34px 60px;}

  input[type=text],input[type=number],select{background:#20293a;border:1px solid var(--divider);color:#eef1f4;padding:9px 11px;border-radius:var(--radius);font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;outline:none;}
  input::placeholder{color:#647089;}
  input:focus,select:focus{border-color:var(--teal);}
  button{font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;border:none;border-radius:var(--radius);padding:9px 16px;cursor:pointer;font-weight:500;transition:filter .12s ease, transform .05s ease;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.5;cursor:default;}
  .btn-primary{background:var(--teal-deep);color:#fff;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:transparent;color:var(--sidebar-txt);border:1px solid var(--divider);}
  .btn-ghost:hover{border-color:var(--teal);color:#fff;}
  .btn-danger{background:transparent;color:var(--red);border:1px solid #4a3230;}
  .btn-danger:hover{background:var(--red);color:#fff;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px;}
  .stat{background:var(--tab);border:1px solid var(--divider);border-radius:var(--radius);padding:18px 18px 16px;}
  .stat .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .stat .value{font-family:'Zilla Slab',serif;font-size:32px;color:#fff;margin-top:6px;font-weight:600;}
  .stat .foot{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .section-title{font-family:'Zilla Slab',serif;font-size:15px;color:#f2efe6;margin:0 0 14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px;}
  .kcard{background:var(--card);color:var(--ink);border-radius:2px;padding:16px 16px 14px;position:relative;box-shadow:0 3px 0 var(--card-shadow), 0 8px 16px rgba(0,0,0,.28);font-family:'IBM Plex Mono',monospace;}
  .kcard::before{content:"";position:absolute;top:12px;left:12px;width:9px;height:9px;border-radius:50%;background:var(--desk);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
  .kcard .kid{position:absolute;top:11px;right:14px;font-size:10.5px;color:var(--ink-soft);letter-spacing:.05em;}
  .kcard h3{font-family:'Zilla Slab',serif;font-size:17px;margin:6px 0 2px 22px;color:var(--ink);font-weight:600;}
  .kcard .meta{margin-left:22px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
  .kcard .skills{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px 22px;}
  .tag{background:rgba(43,33,24,.08);border:1px solid rgba(43,33,24,.18);color:var(--ink);font-size:10.5px;padding:3px 7px;border-radius:2px;}
  .kcard-actions{display:flex;gap:8px;margin-left:22px;}
  .link-btn{background:none;border:none;padding:0;font-size:11.5px;color:var(--teal-deep);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-weight:600;font-family:'IBM Plex Sans',sans-serif;}
  .link-btn.danger{color:var(--red);}
  .stamp{position:absolute;bottom:12px;right:14px;font-family:'Zilla Slab',serif;font-weight:700;font-size:11px;letter-spacing:.09em;padding:4px 8px;border:2px solid;border-radius:3px;transform:rotate(-6deg);text-transform:uppercase;opacity:.9;}
  .stamp.pass{color:var(--green);border-color:var(--green);}
  .stamp.fail{color:var(--red);border-color:var(--red);}
  .empty-state{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--divider);border-radius:var(--radius);grid-column:1/-1;}
  .empty-state h3{color:#e6e9ee;font-size:16px;margin-bottom:6px;}

  .form-card{background:var(--tab);border:1px solid var(--divider);border-radius:var(--radius);padding:26px 28px;max-width:560px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .field input{width:100%;}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .form-row{display:flex;gap:14px;}
  .form-row .field{flex:1;}
  .form-actions{display:flex;gap:10px;margin-top:22px;}

  .filter-card{background:var(--tab);border:1px solid var(--divider);border-radius:var(--radius);padding:22px 26px;margin-bottom:26px;}
  .filter-grid{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:14px;align-items:end;}
  .results-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .result-col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;margin-bottom:12px;}
  .result-col.pass h3{color:var(--green);}
  .result-col.fail h3{color:var(--red);}
  .mini-row{background:var(--card);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:9px 12px;border-radius:2px;margin-bottom:7px;display:flex;justify-content:space-between;}

  .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  .panel{background:var(--tab);border:1px solid var(--divider);border-radius:var(--radius);padding:20px;}
  .panel + .panel{margin-top:16px;}
  .panel h4{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .file-drop{border:1px dashed var(--divider);border-radius:var(--radius);padding:16px;text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:10px;}

  .overlay{position:fixed;inset:0;background:rgba(10,14,20,.62);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--tab);border:1px solid var(--divider);border-radius:var(--radius);padding:26px 28px;width:420px;max-width:92vw;}
  .modal h3{margin:0 0 18px;font-size:17px;color:#f2efe6;}
  .modal p{color:var(--sidebar-txt);font-size:13.5px;line-height:1.6;margin-bottom:22px;}

  #toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--tab-active);border:1px solid var(--teal);color:#fff;padding:11px 16px;border-radius:var(--radius);font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:slidein .18s ease;}
  .toast.error{border-color:var(--red);}
  @keyframes slidein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  #goodbye{display:none;position:fixed;inset:0;background:var(--desk);color:var(--sidebar-txt);align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:200;}
  #goodbye h2{font-size:26px;color:#fff;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#33445c;border-radius:5px;}

  @media(max-width:880px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .filter-grid{grid-template-columns:1fr;}
    .results-cols{grid-template-columns:1fr;}
    .report-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="eyebrow">RVCE &middot; Placement Cell</div>
      <h1>Shortlisting<br>Desk</h1>
      <div class="punch-row"><div class="punch"></div><div class="punch"></div><div class="punch"></div></div>
    </div>
    <nav id="nav">
      <div class="tab" data-view="dashboard"><span class="num">01</span><span>Dashboard</span></div>
      <div class="tab" data-view="candidates"><span class="num">02</span><span>All Candidates</span></div>
      <div class="tab" data-view="add"><span class="num">03</span><span>Add Candidate</span></div>
      <div class="tab" data-view="filter"><span class="num">04</span><span>Shortlist Filter</span></div>
      <div class="tab" data-view="reports"><span class="num">05</span><span>Reports &amp; Export</span></div>
    </nav>
    <div class="sidebar-foot">
      <button id="save-exit-btn">Save &amp; Exit</button>
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Connected to C backend</span></div>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div><h2 id="view-title">Dashboard</h2><div class="sub" id="view-sub"></div></div>
      <div class="topbar-controls" id="topbar-controls"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal-body"></div></div>
<div id="toasts"></div>
<div id="goodbye">
  <h2>Server stopped.</h2>
  <p>Your data was saved to candidates.csv. You can close this tab.</p>
</div>

<script>
/* ============================================================
   This file only talks to the C backend over fetch(). It holds NO
   recruitment-shortlisting logic of its own -- add/edit/delete,
   search, sort, filtering, statistics and report generation all
   happen in the C program (candidate.c / filter.c / sort.c /
   report.c) via the /api/* endpoints below.
   ============================================================ */
const API = '/api';
let currentView = 'dashboard';
let searchTerm = '';
let sortMode = '';
let unsaved = false;
let lastFilterResult = null;

const viewMeta = {
  dashboard:{title:'Dashboard', sub:'Overview of the candidate pool'},
  candidates:{title:'All Candidates', sub:'View, search, sort, edit or remove records'},
  add:{title:'Add Candidate', sub:'Create a new candidate record'},
  filter:{title:'Shortlist Filter', sub:'Filter by minimum age, experience and required skills'},
  reports:{title:'Reports & Export', sub:'Statistics, report export and CSV / backup tools'},
};

function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast' + (isError?' error':'');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2400);
}
function markUnsaved(){ unsaved = true; document.getElementById('conn-dot').classList.add('unsaved'); document.getElementById('conn-text').textContent = 'Unsaved changes -- hit Save Data'; }
function markSaved(){ unsaved = false; document.getElementById('conn-dot').classList.remove('unsaved'); document.getElementById('conn-text').textContent = 'Connected to C backend'; }

async function api(path, opts){
  try{
    const res = await fetch(API + path, opts);
    if(!res.ok){
      let msg = 'Something went wrong.';
      try{ const j = await res.json(); if(j.error) msg = j.error; }catch(e){}
      toast(msg, true);
      return null;
    }
    const ct = res.headers.get('Content-Type')||'';
    if(ct.includes('application/json')) return await res.json();
    return res;
  }catch(err){
    toast('Could not reach the C backend -- is the server still running?', true);
    document.getElementById('conn-dot').style.background = 'var(--red)';
    document.getElementById('conn-text').textContent = 'Disconnected';
    return null;
  }
}

function closeModal(){ document.getElementById('overlay').classList.remove('show'); document.getElementById('modal-body').innerHTML=''; }
function openModal(html){ document.getElementById('modal-body').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

function confirmAction(message, onYes){
  openModal(`<h3>Are you sure?</h3><p>${esc(message)}</p>
    <div class="form-actions">
      <button class="btn-danger" id="confirm-yes">Yes, continue</button>
      <button class="btn-ghost" id="confirm-no">Cancel</button>
    </div>`);
  document.getElementById('confirm-yes').onclick = ()=>{ onYes(); closeModal(); };
  document.getElementById('confirm-no').onclick = closeModal;
}

/* ---------------- view switching ---------------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>setView(t.dataset.view)));
function setView(view){
  currentView = view;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  document.getElementById('view-title').textContent = viewMeta[view].title;
  document.getElementById('view-sub').textContent = viewMeta[view].sub;
  render();
}

async function render(){
  const content = document.getElementById('content');
  const controls = document.getElementById('topbar-controls');
  controls.innerHTML = '';
  if(currentView==='dashboard') await renderDashboard(content);
  else if(currentView==='candidates') await renderCandidates(content, controls);
  else if(currentView==='add') renderAdd(content);
  else if(currentView==='filter') renderFilter(content);
  else if(currentView==='reports') renderReports(content);
}

function cardHTML(c, stampState){
  let stamp = '';
  if(stampState==='pass') stamp = `<div class="stamp pass">Shortlisted</div>`;
  if(stampState==='fail') stamp = `<div class="stamp fail">Not shortlisted</div>`;
  const skills = c.skills ? c.skills.split('|').filter(Boolean) : [];
  return `<div class="kcard">
      <div class="kid">#${String(c.id).padStart(3,'0')}</div>
      <h3>${esc(c.name)}</h3>
      <div class="meta">Age ${c.age} &middot; ${c.experience} yr${c.experience===1?'':'s'} experience</div>
      <div class="skills">${skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
      <div class="kcard-actions">
        <button class="link-btn" onclick="openEdit(${c.id})">Edit</button>
        <button class="link-btn danger" onclick="requestDelete(${c.id}, ${JSON.stringify(c.name)})">Delete</button>
      </div>
      ${stamp}
    </div>`;
}
function emptyState(title, body){ return `<div class="empty-state"><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`; }

/* ---------------- Dashboard ---------------- */
async function renderDashboard(content){
  content.innerHTML = '<div class="empty-state">Loading...</div>';
  const stats = await api('/stats');
  const list = await api('/candidates');
  if(!stats || !list){ return; }
  const recent = [...list].sort((a,b)=>b.id-a.id).slice(0,5);
  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="label">Total Candidates</div><div class="value">${stats.totalCount}</div><div class="foot">records on file</div></div>
      <div class="stat"><div class="label">Avg. Age</div><div class="value">${stats.avgAge.toFixed(1)}</div><div class="foot">years</div></div>
      <div class="stat"><div class="label">Avg. Experience</div><div class="value">${stats.avgExperience.toFixed(1)}</div><div class="foot">years</div></div>
      <div class="stat"><div class="label">Most Experienced</div><div class="value" style="font-size:19px;">${esc(stats.mostExperiencedName||'n/a')}</div><div class="foot">${stats.maxExperience} yrs</div></div>
    </div>
    <div class="section-title">Recently Added</div>
    <div class="card-grid">${recent.length? recent.map(c=>cardHTML(c)).join('') : emptyState('No candidates yet','Head to "Add Candidate" to create your first record.')}</div>`;
}

/* ---------------- All Candidates ---------------- */
async function renderCandidates(content, controls){
  controls.innerHTML = `
    <input type="text" id="search-input" placeholder="Search by name..." value="${esc(searchTerm)}" style="width:220px;">
    <select id="sort-select">
      <option value="">Unsorted (insertion order)</option>
      <option value="name" ${sortMode==='name'?'selected':''}>Name (A &rarr; Z)</option>
      <option value="age" ${sortMode==='age'?'selected':''}>Age (ascending)</option>
      <option value="experience" ${sortMode==='experience'?'selected':''}>Experience (descending)</option>
    </select>`;
  content.innerHTML = '<div class="empty-state">Loading...</div>';

  const qs = new URLSearchParams();
  if(searchTerm) qs.set('search', searchTerm);
  if(sortMode) qs.set('sort', sortMode);
  const list = await api('/candidates?' + qs.toString());
  if(!list) return;

  content.innerHTML = `<div class="card-grid">${list.length? list.map(c=>cardHTML(c)).join('') : emptyState('No matches', searchTerm? `Nothing matches "${searchTerm}".` : 'No candidates yet.')}</div>`;

  const s = document.getElementById('search-input');
  s.addEventListener('input', e=>{ searchTerm = e.target.value; render(); });
  document.getElementById('sort-select').addEventListener('change', e=>{ sortMode = e.target.value; render(); });
}

/* ---------------- Add / Edit ---------------- */
function renderAdd(content){
  content.innerHTML = `
    <div class="form-card">
      <div class="field"><label>Full Name</label><input type="text" id="f-name" placeholder="e.g. Priya Menon"></div>
      <div class="form-row">
        <div class="field"><label>Age</label><input type="number" id="f-age" placeholder="24"></div>
        <div class="field"><label>Experience (years)</label><input type="number" id="f-exp" placeholder="2"></div>
      </div>
      <div class="field">
        <label>Skills</label>
        <input type="text" id="f-skills" placeholder="C|Java|SQL">
        <div class="hint">Pipe-separated (e.g. C|Java|SQL) -- matches the format used by candidates.csv and the shortlist filter.</div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" id="f-submit">Save Candidate</button>
        <button class="btn-ghost" id="f-cancel">Clear</button>
      </div>
    </div>`;
  document.getElementById('f-submit').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    const age = parseInt(document.getElementById('f-age').value,10) || 0;
    const experience = parseInt(document.getElementById('f-exp').value,10) || 0;
    const skills = document.getElementById('f-skills').value.trim();
    if(!name){ toast('Name is required.', true); return; }
    const result = await api('/candidates', {method:'POST', body: JSON.stringify({name, age, experience, skills})});
    if(result){ markUnsaved(); toast(`Added ${name} (unsaved -- hit Save Data)`); setView('candidates'); }
  };
  document.getElementById('f-cancel').onclick = ()=>render();
}

async function openEdit(id){
  const list = await api('/candidates');
  if(!list) return;
  const c = list.find(x=>x.id===id);
  if(!c) return;
  openModal(`
    <h3>Edit Candidate #${String(c.id).padStart(3,'0')}</h3>
    <div class="field"><label>Full Name</label><input type="text" id="e-name" value="${esc(c.name)}"></div>
    <div class="form-row">
      <div class="field"><label>Age</label><input type="number" id="e-age" value="${c.age}"></div>
      <div class="field"><label>Experience (years)</label><input type="number" id="e-exp" value="${c.experience}"></div>
    </div>
    <div class="field"><label>Skills</label><input type="text" id="e-skills" value="${esc(c.skills)}"></div>
    <div class="form-actions">
      <button class="btn-primary" id="e-save">Save Changes</button>
      <button class="btn-ghost" id="e-cancel">Cancel</button>
    </div>`);
  document.getElementById('e-save').onclick = async ()=>{
    const name = document.getElementById('e-name').value.trim();
    const age = parseInt(document.getElementById('e-age').value,10) || 0;
    const experience = parseInt(document.getElementById('e-exp').value,10) || 0;
    const skills = document.getElementById('e-skills').value.trim();
    if(!name){ toast('Name is required.', true); return; }
    const result = await api('/candidates/'+id, {method:'PUT', body: JSON.stringify({name, age, experience, skills})});
    if(result){ markUnsaved(); toast('Updated (unsaved -- hit Save Data)'); closeModal(); render(); }
  };
  document.getElementById('e-cancel').onclick = closeModal;
}

function requestDelete(id, name){
  confirmAction(`Delete ${name}'s record? This can't be undone once saved.`, async ()=>{
    const result = await api('/candidates/'+id, {method:'DELETE'});
    if(result){ markUnsaved(); toast(`Deleted ${name} (unsaved -- hit Save Data)`); render(); }
  });
}

/* ---------------- Shortlist Filter ---------------- */
function renderFilter(content){
  content.innerHTML = `
    <div class="filter-card">
      <div class="filter-grid">
        <div class="field"><label>Minimum Age</label><input type="number" id="ff-age" value="0"></div>
        <div class="field"><label>Minimum Experience</label><input type="number" id="ff-exp" value="0"></div>
        <div class="field"><label>Required Skills</label><input type="text" id="ff-skills" placeholder="e.g. Java SQL (space separated, must have all)"></div>
        <button class="btn-primary" id="ff-run">Run Filter</button>
      </div>
    </div>
    <div id="filter-results"></div>`;
  document.getElementById('ff-run').onclick = async ()=>{
    const minAge = parseInt(document.getElementById('ff-age').value,10) || 0;
    const minExperience = parseInt(document.getElementById('ff-exp').value,10) || 0;
    const skills = document.getElementById('ff-skills').value;
    const result = await api('/filter', {method:'POST', body: JSON.stringify({minAge, minExperience, skills})});
    if(!result) return;
    lastFilterResult = result;
    toast(`Filter run: ${result.shortlisted.length} shortlisted, ${result.rejected.length} not shortlisted`);
    document.getElementById('filter-results').innerHTML = `
      <div class="results-cols">
        <div class="result-col pass"><h3>Shortlisted (${result.shortlisted.length})</h3>
          ${result.shortlisted.length? result.shortlisted.map(c=>`<div class="mini-row"><span>${esc(c.name)}</span><span>${c.age}y &middot; ${c.experience}yr</span></div>`).join('') : '<div class="hint">No one met these criteria.</div>'}
        </div>
        <div class="result-col fail"><h3>Not Shortlisted (${result.rejected.length})</h3>
          ${result.rejected.length? result.rejected.map(c=>`<div class="mini-row"><span>${esc(c.name)}</span><span>${c.age}y &middot; ${c.experience}yr</span></div>`).join('') : '<div class="hint">Everyone met the criteria.</div>'}
        </div>
      </div>`;
  };
}

/* ---------------- Reports & Export ---------------- */
function renderReports(content){
  content.innerHTML = `
    <div class="report-grid">
      <div>
        <div class="section-title">Generate Report</div>
        <div class="filter-card">
          <div class="filter-grid">
            <div class="field"><label>Minimum Age</label><input type="number" id="rf-age" value="0"></div>
            <div class="field"><label>Minimum Experience</label><input type="number" id="rf-exp" value="0"></div>
            <div class="field"><label>Required Skills</label><input type="text" id="rf-skills" placeholder="e.g. Java SQL"></div>
            <button class="btn-primary" id="rf-run">Download Report (.txt)</button>
          </div>
        </div>
      </div>
      <div>
        <div class="panel">
          <h4>Export</h4>
          <button class="btn-ghost" id="btn-export-csv" style="width:100%;">Export All Candidates (.csv)</button>
        </div>
        <div class="panel">
          <h4>Import</h4>
          <div class="file-drop">Import candidates from a CSV file (id,name,age,experience,skills &mdash; skills pipe-separated). Records are appended, not replaced.</div>
          <input type="file" id="import-csv" accept=".csv" style="width:100%;">
        </div>
        <div class="panel">
          <h4>Save</h4>
          <button class="btn-primary" id="btn-save" style="width:100%;">Save Data to candidates.csv</button>
        </div>
      </div>
    </div>`;

  document.getElementById('rf-run').onclick = async ()=>{
    const minAge = parseInt(document.getElementById('rf-age').value,10) || 0;
    const minExperience = parseInt(document.getElementById('rf-exp').value,10) || 0;
    const skills = document.getElementById('rf-skills').value;
    const res = await api('/report', {method:'POST', body: JSON.stringify({minAge, minExperience, skills})});
    if(!res) return;
    const blob = await res.blob();
    downloadBlob(blob, 'shortlist_report.txt');
    toast('Report downloaded');
  };
  document.getElementById('btn-export-csv').onclick = async ()=>{
    const res = await api('/export/csv');
    if(!res) return;
    const blob = await res.blob();
    downloadBlob(blob, 'candidates.csv');
    toast('CSV exported');
  };
  document.getElementById('btn-save').onclick = async ()=>{
    const res = await api('/save', {method:'POST'});
    if(res){ markSaved(); toast('Saved to candidates.csv'); }
  };
  document.getElementById('import-csv').onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const res = await api('/import/csv', {method:'POST', body: text});
    if(res){ markUnsaved(); toast(`Imported ${res.imported} candidate(s) (unsaved -- hit Save Data)`); }
  };
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---------------- Save & Exit ---------------- */
document.getElementById('save-exit-btn').onclick = ()=>{
  confirmAction('Save all data and shut down the local server? You will need to relaunch the program to use it again.', async ()=>{
    const res = await api('/exit', {method:'POST'});
    document.getElementById('shell').style.display = 'none';
    document.getElementById('goodbye').style.display = 'flex';
  });
};

/* ---------------- init ---------------- */
setView('dashboard');
</script>
